# Run the full stack: db + backend + frontend + monitoring
# Usage: docker compose up --build
# With the help assistant (pagewise, answers questions about this app from its docs):
#   docker compose --profile assistant up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass
      POSTGRES_DB: taskdb
    ports:
      - "5432:5432" # host:container — connect from Mac with localhost:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data # keep DB data between restarts
    healthcheck:
      # Backend waits until Postgres accepts connections
      test: ["CMD-SHELL", "pg_isready -U taskuser -d taskdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000" # API + Swagger docs at http://localhost:8000/docs
    environment:
      # Inside Docker, hostname `db` resolves to the db service (not localhost)
      DATABASE_URL: postgresql://taskuser:taskpass@db:5432/taskdb
      SECRET_KEY: dev-secret-change-in-production
      # For local: localhost. On EC2 use docker-compose.prod.yml (PUBLIC_HOST).
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Browser calls this URL — must be reachable from the user's machine.
        # Local: localhost. EC2: use docker-compose.prod.yml with PUBLIC_HOST.
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80" # http://localhost:3000
    depends_on:
      - backend

  # Chat bot for this repository (the round button in the app). It reads the repo's docs, code and config (never
  # .env, keys or Terraform state) and answers questions about it, citing the file and lines each answer came from.
  # The frontend reaches it through nginx at /assistant/ (see frontend/nginx.conf).
  # Needs ANTHROPIC_API_KEY (put it in a .env file next to this one, which is git-ignored).
  pagewise:
    profiles: ["assistant"]
    # Local checkout instead of GitHub: PAGEWISE_SRC=../pagewise docker compose --profile assistant up --build
    build: ${PAGEWISE_SRC:-https://github.com/ron1120/pagewise.git#main}
    environment:
      - ANTHROPIC_API_KEY # passed through from your shell or .env; never written in this file
      - ANTHROPIC_BASE_URL # optional: only set it to point at a test double
      - PAGEWISE_MODEL # optional, defaults to claude-sonnet-5-5
      - PAGEWISE_DOCS_DIR=/docs
      - PAGEWISE_DOCS_CODE=1 # read the code and config files too, not just the Markdown
      - PAGEWISE_SOURCE_NAME=this repository's files
      - PAGEWISE_TOP_K=6
      - PAGEWISE_MIN_SCORE=0.3
      - PAGEWISE_DOCS_BASE_URL=https://github.com/ron1120/task-manager-infrastructure/blob/main
    volumes:
      - .:/docs:ro # the repo itself, read-only, is the knowledge base
    ports:
      - "8010:8000" # chat page and API, for trying it directly: http://localhost:8010

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090" # http://localhost:9090
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3001:3000" # http://localhost:3001 (3000 is already the frontend). Login: admin/admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data: # named volume for Postgres files
  prometheus_data:
  grafana_data:
