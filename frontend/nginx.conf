server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Help assistant (the optional pagewise container). A variable keeps nginx starting even when the
    # assistant is not running; requests then get a 502 and the app simply hides the help button.
    location /assistant/ {
        resolver 127.0.0.11 valid=10s;
        set $assistant http://pagewise:8000;
        rewrite ^/assistant/(.*)$ /$1 break;
        proxy_pass $assistant;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
    }
}
